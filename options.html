<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <meta name="color-scheme" content="light dark">
  <style>
    body { font: message-box; font-size: 14px; margin: 16px; }
    label { display: block; margin-bottom: 6px; font-weight: 600; }
    select { min-width: 240px; font-size: inherit; padding: 4px; }
    p { margin: 10px 0 0; opacity: 0.75; max-width: 520px; }
  </style>
</head>
<body>
  <label for="fallback">Fallback container</label>
  <select id="fallback"></select>
  <p>Used when the tab you were on had no container. With "No container", such new tabs are left alone.</p>
  <script src="options.js"></script>
</body>
</html>
